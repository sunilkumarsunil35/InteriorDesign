<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floorplan Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D canvas; small instrument panels pinned to the corners */
  :root {
    --bg: #e9eef0;
    --panel: rgba(250, 252, 252, 0.92);
    --fg: #1b2327;
    --muted: #56636a;
    --line: #c9d3d7;
    --accent: #1d6d8a;
    --accent-ink: #ffffff;
    --scene-sky: #dbe4e8;
    --scene-ground: #c5ccc7;
    --map-room: #f6f8f8;
    --map-out: #e5dfd2;
    --map-wall: #26313a;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --gap: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1416; --panel: rgba(20, 27, 30, 0.9); --fg: #e3eaec; --muted: #94a3a9; --line: #2c383d;
      --accent: #5db4d2; --accent-ink: #06222c; --scene-sky: #182024; --scene-ground: #1f282b;
      --map-room: #1c2529; --map-out: #2c2a23; --map-wall: #d6dfe2; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1416; --panel: rgba(20, 27, 30, 0.9); --fg: #e3eaec; --muted: #94a3a9; --line: #2c383d;
    --accent: #5db4d2; --accent-ink: #06222c; --scene-sky: #182024; --scene-ground: #1f282b;
    --map-room: #1c2529; --map-out: #2c2a23; --map-wall: #d6dfe2; color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--mono);
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .panel {
    position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #info {
    top: calc(var(--gap) + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    width: min(340px, calc(100% - 32px)); padding: 14px 16px; display: grid; gap: 10px;
  }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: 700 20px/1.15 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .facts b { color: var(--fg); font-weight: 500; }
  .check { font-size: 12px; color: var(--muted); }
  .check b { color: var(--accent); font-weight: 500; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button + button { border-left: 1px solid var(--line); }
  button, .btn {
    font: 500 12px/1 var(--mono); color: var(--fg); background: transparent; border: 1px solid var(--line);
    border-radius: 5px; padding: 9px 10px; cursor: pointer; text-align: center;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, #view:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions button { flex: 1 1 auto; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; }

  #map {
    top: calc(var(--gap) + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    width: 236px; padding: 8px; display: grid; gap: 6px;
  }
  #map .seg button { padding: 6px; }
  #minimap { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; cursor: crosshair; }
  #source { width: 100%; max-width: 100%; display: block; border-radius: 3px; background: #fff; }
  .legend { font-size: 11px; color: var(--muted); }

  #roomTag {
    top: calc(var(--gap) + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    padding: 8px 14px; text-align: center; pointer-events: none;
  }
  #roomTag .name { font: 700 15px/1.2 var(--display); letter-spacing: 0.03em; }
  #roomTag .dims { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  #hint {
    bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%); padding: 8px 12px; font-size: 12px; color: var(--muted);
    max-width: calc(100% - 32px); text-align: center; pointer-events: none;
  }
  #hint kbd { font: 500 11px var(--mono); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }

  #joy {
    position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel); pointer-events: none;
  }
  #joy .knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--accent); opacity: 0.85; }

  #toast {
    position: fixed; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); padding: 8px 12px; border-radius: 5px; font-size: 12px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #drop { position: fixed; inset: 0; border: 3px dashed var(--accent); pointer-events: none; }

  :root[data-host="artifact"] .download-only { display: none; }

  @media (max-width: 720px) {
    #info { width: auto; right: max(16px, env(safe-area-inset-right, 0px)); padding: 10px 12px; gap: 8px; }
    .eyebrow, .check { display: none; }
    h1 { font-size: 16px; }
    .facts, .toggles { font-size: 11px; }
    .actions button { flex: 1 1 40%; padding: 8px 6px; font-size: 11px; }
    #map { top: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: 128px; padding: 6px; }
    #map .legend, #map .seg { display: none; }
    #roomTag { top: auto; left: max(16px, env(safe-area-inset-left, 0px)); transform: none; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D view of the floor plan"></canvas>

<header class="panel" id="info">
  <div class="eyebrow" id="eyebrow">Plan JSON to 3D</div>
  <h1 id="title">Loading plan…</h1>
  <div class="facts" id="facts"></div>
  <div class="check" id="check"></div>
  <div class="seg" role="group" aria-label="View mode">
    <button id="btnOrbit" aria-pressed="true">Dollhouse</button>
    <button id="btnWalk" aria-pressed="false">Walk in</button>
  </div>
  <div class="toggles">
    <label class="toggle"><input type="checkbox" id="optCutaway"> Cut walls at 1.3 m</label>
    <label class="toggle"><input type="checkbox" id="optBob" checked> Head bob</label>
  </div>
  <div class="actions">
    <button id="btnLoad">Load plan.json</button>
    <button id="btnCopy">Copy plan JSON</button>
    <button id="btnGlb" class="download-only">Export .glb</button>
    <button id="btnScene" class="download-only">Export scene.json</button>
  </div>
</header>

<aside class="panel" id="map" aria-label="Plan map">
  <div class="seg" role="group" aria-label="Map view">
    <button id="tabPlan" aria-pressed="true">Plan</button>
    <button id="tabSource" aria-pressed="false">Source image</button>
  </div>
  <canvas id="minimap" width="440" height="440" aria-label="Plan map, click to walk to a spot"></canvas>
  <img id="source" alt="Source floor-plan image the JSON was extracted from" hidden>
  <div class="legend">Click the map to walk to that spot.</div>
</aside>

<div class="panel" id="roomTag" hidden><div class="name" id="roomName"></div><div class="dims" id="roomDims"></div></div>
<div class="panel" id="hint"></div>
<div id="joy" hidden><div class="knob" id="knob"></div></div>
<div id="drop" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script type="module" src="viewer/app.js"></script>
</body>
</html>
